name: Deploy to Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Run frontend lint
        working-directory: ./frontend
        run: npm run lint || true

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install pytest

  build-and-deploy:
    name: Build and Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          # Create a tarball of the project (ignore file change warnings)
          tar -czf deploy.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            --exclude='dist' \
            --exclude='.vite' \
            --exclude='.cache' \
            --exclude='*.pyc' \
            --warning=no-file-changed \
            . || true

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          source: "deploy.tar.gz"
          target: "/tmp"
          timeout: 120s
          command_timeout: 30m
          strip_components: 0
          overwrite: true

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script_stop: false
          script: |
            echo "📦 Starting deployment..."

            # Create directory if not exists
            sudo mkdir -p /app/edupy
            sudo chown -R $USER:$USER /app

            cd /app/edupy

            # Backup current deployment
            if [ -d "/app/edupy/backend" ]; then
              echo "📋 Backing up current deployment..."
              sudo cp -r /app/edupy /app/edupy-backup-$(date +%Y%m%d-%H%M%S) 2>/dev/null || true
            fi

            # Extract new deployment
            echo "📂 Extracting files..."
            tar -xzf /tmp/deploy.tar.gz -C /app/edupy 2>/dev/null || true

            # Create .env file
            echo "🔐 Creating environment file..."
            echo "ENVIRONMENT=production" > /app/edupy/.env
            echo "DATABASE_URL=postgresql://edupy_user:REDACTED_PG_PASSWORD@host.docker.internal:5432/edupy" >> /app/edupy/.env
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> /app/edupy/.env
            echo "ERROR_REPORT_EMAIL=${{ secrets.ERROR_REPORT_EMAIL }}" >> /app/edupy/.env
            echo "FROM_EMAIL=${{ secrets.FROM_EMAIL }}" >> /app/edupy/.env
            echo "CORS_ORIGINS=https://edupy.org,http://localhost:3000" >> /app/edupy/.env
            echo "DEBUG=false" >> /app/edupy/.env
            echo "ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}" >> /app/edupy/.env
            echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> /app/edupy/.env

            # Build and start containers
            echo "🐳 Building and starting Docker containers..."
            cd /app/edupy
            docker compose down 2>/dev/null || true
            docker compose build
            docker compose up -d

            # Wait for services to be healthy
            echo "⏳ Waiting for services to start..."
            sleep 30

            # Check container status
            echo "🔍 Checking container status..."
            docker compose ps

            # Create admin user if not exists
            echo "👤 Creating admin user..."
            docker compose exec -T backend python create_admin.py || true

            # Cleanup
            echo "🧹 Cleaning up..."
            rm -f /tmp/deploy.tar.gz
            docker system prune -f 2>/dev/null || true

            echo "✅ Deployment completed!"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to Lightsail completed successfully!"
          else
            echo "❌ Deployment failed. Check logs for details."
          fi

  rollback:
    name: Rollback (Manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && failure()
    needs: build-and-deploy

    steps:
      - name: Rollback to previous version
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            echo "🔄 Rolling back to previous deployment..."
            cd /app

            # Find the latest backup
            LATEST_BACKUP=$(ls -td edupy-backup-* 2>/dev/null | head -1)

            if [ -n "$LATEST_BACKUP" ]; then
              echo "Found backup: $LATEST_BACKUP"
              sudo rm -rf /app/edupy
              sudo mv "$LATEST_BACKUP" /app/edupy
              cd /app/edupy
              docker compose down || true
              docker compose up -d
              echo "✅ Rollback completed!"
            else
              echo "❌ No backup found for rollback"
              exit 1
            fi
