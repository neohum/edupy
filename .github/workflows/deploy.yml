name: Deploy to Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: ./frontend
        run: npm run lint || true

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install pytest

  build-and-deploy:
    name: Build and Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          # Create a tarball of the project
          tar -czf deploy.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            .

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/tmp"

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e

            echo "📦 Extracting deployment package..."
            cd /app/edupy

            # Backup current deployment
            if [ -d "/app/edupy/backend" ]; then
              echo "📋 Backing up current deployment..."
              sudo cp -r /app/edupy /app/edupy-backup-$(date +%Y%m%d-%H%M%S) || true
            fi

            # Extract new deployment
            sudo tar -xzf /tmp/deploy.tar.gz -C /app/edupy --strip-components=0
            sudo chown -R $USER:$USER /app/edupy

            # Create .env file
            echo "🔐 Creating environment file..."
            cat > /app/edupy/.env << EOF
            ENVIRONMENT=production
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            ERROR_REPORT_EMAIL=${{ secrets.ERROR_REPORT_EMAIL }}
            FROM_EMAIL=${{ secrets.FROM_EMAIL }}
            CORS_ORIGINS=https://edupy.dev,https://www.edupy.dev
            DEBUG=false
            ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            EOF

            # Build and start containers
            echo "🐳 Building and starting Docker containers..."
            cd /app/edupy
            docker compose down || true
            docker compose build --no-cache
            docker compose up -d

            # Wait for services to be healthy
            echo "⏳ Waiting for services to start..."
            sleep 30

            # Check container status
            echo "🔍 Checking container status..."
            docker compose ps

            # Health check
            echo "🏥 Running health checks..."
            curl -f http://localhost:3000/health || echo "Frontend health check failed"
            curl -f http://localhost:8000/api/health || echo "Backend health check failed"

            # Cleanup
            echo "🧹 Cleaning up..."
            rm -f /tmp/deploy.tar.gz
            docker system prune -f

            echo "✅ Deployment completed successfully!"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to Lightsail completed successfully!"
          else
            echo "❌ Deployment failed. Check logs for details."
          fi

  rollback:
    name: Rollback (Manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && failure()
    needs: build-and-deploy

    steps:
      - name: Rollback to previous version
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            echo "🔄 Rolling back to previous deployment..."
            cd /app

            # Find the latest backup
            LATEST_BACKUP=$(ls -td edupy-backup-* 2>/dev/null | head -1)

            if [ -n "$LATEST_BACKUP" ]; then
              echo "Found backup: $LATEST_BACKUP"
              sudo rm -rf /app/edupy
              sudo mv "$LATEST_BACKUP" /app/edupy
              cd /app/edupy
              docker compose down || true
              docker compose up -d
              echo "✅ Rollback completed!"
            else
              echo "❌ No backup found for rollback"
              exit 1
            fi
