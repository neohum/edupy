[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edupy"
version = "0.1.0"
description = "초등학생을 위한 교육용 파이썬 게임 라이브러리 — 한글 API, 보일러플레이트 없음, 친절한 한글 에러"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "EduPy", email = "neohum77@gmail.com" }]
keywords = ["education", "game", "pygame", "korean", "kids", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Korean",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Games/Entertainment",
]

# 기본 설치(`pip install edupy`)는 의존성이 없다 — 브라우저(Pyodide)에서 그대로 돌릴 수 있게.
# 데스크톱에서 GUI 로 쓰려면 `pip install edupy[desktop]`.
dependencies = []

[project.optional-dependencies]
desktop = ["pygame-ce>=2.4"]
dev = ["pytest>=7", "pygame-ce>=2.4", "build", "twine"]

[project.urls]
Homepage = "https://github.com/neohum/edupy"
Repository = "https://github.com/neohum/edupy"

[tool.hatch.build.targets.wheel]
packages = ["edupy"]

[tool.hatch.build.targets.wheel.force-include]
"edupy/assets" = "edupy/assets"
"edupy/snippets" = "edupy/snippets"
