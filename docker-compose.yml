services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edupy-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - edupy-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edupy-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL:-sqlite:///app/edupy.db}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ERROR_REPORT_EMAIL=${ERROR_REPORT_EMAIL}
      - FROM_EMAIL=${FROM_EMAIL}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://edupy.dev}
      - DEBUG=false
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./data:/app/data
      - ./backend/edupy.db:/app/edupy.db
      - backend-uploads:/app/uploads
    networks:
      - edupy-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  edupy-network:
    driver: bridge

volumes:
  backend-uploads:
    driver: local
